name: Testy a nasazení na GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  deploy:
    if: github.event_name != 'pull_request'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Připravit soubory
        run: |
          mkdir _site
          cp -r index.html styles.css src icons manifest.webmanifest sw.js _site/
          sed -i "s/__VERSION__/${GITHUB_SHA::12}/" _site/sw.js
          (cd _site && find . -type f ! -name sw.js ! -name precache.json | sed 's|^\./||' | sort \
            | python3 -c 'import json,sys; print(json.dumps(["./"] + [l.strip() for l in sys.stdin]))' > precache.json)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
